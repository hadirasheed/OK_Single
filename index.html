<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>OneKilo — Patient Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#E7E5DE}
  a{color:#4E7B4E;text-decoration:none}
  button{font-family:inherit;cursor:pointer}
  input{font-family:inherit}
  .ms{font-family:'Material Symbols Rounded';line-height:1;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
  .scr{overflow-y:auto;-webkit-overflow-scrolling:touch}
  .scr::-webkit-scrollbar{width:0}
  .hx{overflow-x:auto}
  .hx::-webkit-scrollbar{height:0}
  .hd{font-family:'Poppins',sans-serif;letter-spacing:-.02em}
  #root{font-family:'Inter',sans-serif;color:#1A1A17}
  input[type=range]{accent-color:#5C7A5C;height:26px}
  @keyframes okSlide{from{transform:translateX(-100%)}to{transform:translateX(0)}}
  @keyframes okFade{from{opacity:0}to{opacity:1}}
  @keyframes okRise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  @keyframes okSheet{from{transform:translateY(100%)}to{transform:translateY(0)}}
  @keyframes okPop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/plain" id="appsrc">
const { useState, useRef } = React;
const Ic = ({n, s, c, ...r}) => <span className="ms" style={{fontSize:s||22, color:c, ...(r.style||{})}}>{n}</span>;

// ---------- shared style helpers ----------
const seg = on => ({flex:1,border:'none',borderRadius:13,padding:'11px 0',fontSize:13,transition:'all .18s',background:on?'#fff':'transparent',color:on?'#1A1A17':'#9A958A',fontWeight:on?600:500,boxShadow:on?'0 1px 4px rgba(0,0,0,.08)':'none'});
const slotSt = on => ({borderRadius:14,padding:'11px 18px',fontSize:14,transition:'all .18s',background:on?'#1A1A17':'#fff',color:on?'#fff':'#1A1A17',border:'1px solid '+(on?'#1A1A17':'#EDEAE2'),fontWeight:on?600:500});
const dateSt = on => ({flexShrink:0,width:58,borderRadius:18,padding:'12px 0',textAlign:'center',transition:'all .18s',background:on?'#1A1A17':'#fff',color:on?'#fff':'#1A1A17',border:'1px solid '+(on?'#1A1A17':'#EDEAE2')});
const optRow = on => ({display:'flex',alignItems:'center',gap:12,cursor:'pointer',transition:'all .16s',borderRadius:18,padding:'16px 18px',background:on?'#EAF1E7':'#fff',border:'1.5px solid '+(on?'#5C7A5C':'#EDEAE2')});
const tog = on => ({track:{width:48,height:28,borderRadius:99,padding:3,display:'flex',alignItems:'center',cursor:'pointer',transition:'background .22s',flexShrink:0,background:on?'#5C7A5C':'#DBD6CC'},knob:{width:22,height:22,borderRadius:'50%',background:'#fff',transition:'transform .22s cubic-bezier(.4,0,.2,1)',transform:'translateX('+(on?'20px':'0')+')'}});
const vstep = st => {const done=st==='done',active=st==='active';return {dot:{width:34,height:34,borderRadius:'50%',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',color:done?'#fff':active?'#46603F':'#C9C4B8',background:done?'#5C7A5C':active?'#EAF1E7':'#F0EEE7',border:done?'none':(active?'2px solid #5C7A5C':'1px solid #E2DED3')},titleColor:done||active?'#1A1A17':'#9A958A',lineColor:done?'#5C7A5C':'#E2DED3'};};
const pillBtn = {width:'100%',background:'#1A1A17',color:'#fff',border:'none',borderRadius:99,padding:18,fontSize:16,fontWeight:600,transition:'transform .12s'};
const card = {background:'#fff',border:'1px solid #EDEAE2',borderRadius:24,padding:22};
const kicker = {fontSize:14,color:'#9A958A',fontWeight:600,marginBottom:6};
const AVATAR = 'radial-gradient(circle at 32% 28%,#8FB98F,#4E7B4E 78%)';

// ---------- BMI ----------
function bmiInfo(weight,height){
  const h=(parseFloat(height)||0)/100, w=parseFloat(weight)||0;
  const n = h>0 ? w/(h*h) : 0;
  let label='Healthy weight', color='#46603F';
  if(n<18.5){label='Underweight';color='#B57A28';}
  else if(n<25){label='Healthy weight';color='#46603F';}
  else if(n<30){label='Overweight';color='#C55A43';}
  else {label='Obese';color='#C55A43';}
  return {n, bmi:n.toFixed(1), label, color, eligible:n>=25};
}

// ---------- onboarding question data ----------
const QMAP = {
 1:{kicker:'Step 2 · Question 1 of 4',heading:'What brings you here?',title:'What is your primary motivation right now?',subtitle:'This helps us customize your physician care plan.',field:'motivation',multi:false,opts:[
   ['wf','Weight & Fat Loss','Shedding weight and keeping it off long-term'],
   ['ac','Appetite & Craving Control','Managing constant hunger, snacking, or overeating'],
   ['ej','Energy & Joint Comfort','Reducing body aches, stiffness, and chronic fatigue'],
   ['wb','Overall Wellbeing & Confidence','Feeling healthier, lighter, and more active daily'],
   ['mb','Metabolic & Blood Sugar Health','Managing Diabetes, PCOS, or Thyroid concerns']]},
 2:{kicker:'Step 2 · Question 2 of 4',heading:'What brings you here?',title:'How much weight are you aiming to lose?',subtitle:'',field:'weightGoal',multi:false,opts:[
   ['g1','5 – 10 kg','Mild to moderate reduction'],
   ['g2','10 – 20 kg','Significant metabolic transformation'],
   ['g3','20+ kg','Comprehensive health reset']]},
 3:{kicker:'Step 2 · Question 3 of 4',heading:'What brings you here?',title:'Where would you like us to focus first?',subtitle:'All OneKilo programs include our full medical, diet, and coaching team. This simply sets your initial care priority.',field:'focus',multi:false,opts:[
   ['dm','Doctor & Medication Focus','Safe medical evaluation & prescription management'],
   ['dn','Custom Diet & Nutrition','Structured meal planning paired with doctor care'],
   ['hl','Habit & Lifestyle Coaching','Support for cravings, routines, and accountability'],
   ['ar','Accelerated Reset','High-intensity momentum for the first 30 days'],
   ['cc','360° Complete Care','Full-team onboarding — doctor, diet, mobility & psychological support']]},
 4:{kicker:'Step 2 · Question 4 of 4',heading:'What brings you here?',title:'How would you describe your daily movement?',subtitle:'',field:'movement',multi:false,opts:[
   ['m1','Mostly Sedentary','Desk job, minimal walking (< 3,000 steps/day)'],
   ['m2','Lightly Active','Occasional walks or standing tasks (~3,000–6,000 steps/day)'],
   ['m3','Moderately Active','Workouts 2–3× a week (~6,000–10,000 steps/day)'],
   ['m4','Highly Active','On your feet all day or daily exercise (> 10,000 steps/day)']]},
 5:{kicker:'Step 3 · Question 1 of 2',heading:'A bit about your health',title:'Are you currently managing or taking medication for any of these?',subtitle:'Select all that apply.',field:'medical',multi:true,opts:[
   ['diab','Diabetes / Pre-diabetes',''],['thy','Thyroid disorders',''],['gi','Gastrointestinal / Gastric issues',''],['bp','High blood pressure / Cholesterol',''],['none','None of the above','']]},
 6:{kicker:'Step 3 · Question 2 of 2',heading:'A bit about your health',title:'Have you previously used prescription weight-loss treatments?',subtitle:'Including Ozempic, Wegovy, Mounjaro, or oral weight-loss drugs.',field:'prevMed',multi:false,opts:[
   ['p1','No, this is my first time',''],['p2','Yes, currently taking weight-loss medication',''],['p3','Yes, taken in the past (currently stopped)','']]},
};

const NAV = [
  {key:'home',label:'Home',icon:'home'},{key:'appointments',label:'Appointments',icon:'calendar_month'},
  {key:'lab',label:'Lab',icon:'science'},{key:'medication',label:'Medication',icon:'medication'},
  {key:'progress',label:'Progress',icon:'monitoring'},{key:'notifications',label:'Notifications',icon:'notifications'},
  {key:'profile',label:'Profile',icon:'person'},
];
const STAGES = [
  {kicker:'Your first consult',cardTitle:'Consult confirmed',cardBody:'Meet your OneKilo physician over video. They’ll assess your fit and next steps.',hasMeta:true,cta:'Mark consult complete →'},
  {kicker:'Next step',cardTitle:'Your 3-month program',cardBody:'Specialist care, home labs, and monthly medication.',hasMeta:false,cta:'Purchase program'},
  {kicker:'Month 1 of 3',cardTitle:'Home lab collection',cardBody:'A collector visits your home — included in your program at no extra charge.',hasMeta:false,cta:'Book lab collection'},
  {kicker:'Results are in',cardTitle:'Time to review results',cardBody:'Your specialist will go over your results and set your medication plan.',hasMeta:true,cta:'Book second consult'},
];
const ADDRESS = 'Ponoth Road, Kaloor, Kochi, Kerala 682017';

// ================= APP =================
function App(){
  const [phase,setPhase]=useState('onboard');      // onboard | success | payment | app
  const [pg,setPg]=useState(0);                     // onboarding page 0..8
  const [otpOpen,setOtpOpen]=useState(false); const [otp,setOtp]=useState('');
  const [route,setRoute]=useState('home'); const [stage,setStage]=useState(0);
  const [drawer,setDrawer]=useState(false);
  const [apptTab,setApptTab]=useState('upcoming'); const [profileTab,setProfileTab]=useState('personal');
  const [gender,setGender]=useState('Male');
  const [age,setAge]=useState(34); const [weight,setWeight]=useState(88); const [height,setHeight]=useState(170);
  const [ans,setAns]=useState({motivation:'',weightGoal:'',focus:'',movement:'',medical:[],prevMed:''});
  const [pincode,setPincode]=useState(''); const [pinChecked,setPinChecked]=useState(false);
  const [consultDate,setConsultDate]=useState('23'); const [consultSlot,setConsultSlot]=useState('2:30 PM');
  const [labDate,setLabDate]=useState('25'); const [labSlot,setLabSlot]=useState('Morning · 9–11 AM');
  const [waNotif,setWaNotif]=useState(true); const [copied,setCopied]=useState(false);
  const [notif,setNotif]=useState({appt_wa:true,appt_app:true,lab_wa:true,lab_app:false,del_wa:true,del_app:true,rev_wa:true,rev_app:false});
  const advTimer=useRef(); const copyTimer=useRef();

  const go=r=>{setRoute(r);setDrawer(false);};
  const next=()=>setPg(p=>Math.min(p+1,8));
  const chooseAdvance=(field,val)=>{setAns(a=>({...a,[field]:val}));clearTimeout(advTimer.current);advTimer.current=setTimeout(next,240);};
  const toggleMedical=k=>setAns(a=>{if(k==='none')return{...a,medical:a.medical.includes('none')?[]:['none']};let arr=a.medical.filter(x=>x!=='none');arr=arr.includes(k)?arr.filter(x=>x!==k):[...arr,k];return{...a,medical:arr};});
  const onPin=v=>{setPincode((v.match(/\d/g)||[]).join('').slice(0,6));setPinChecked(false);};
  const checkPin=()=>{if(pincode.length>=6)setPinChecked(true);};
  const onOtp=v=>setOtp((v.match(/\d/g)||[]).join('').slice(0,4));
  const verifyOtp=()=>{if(otp.length>=4){setOtpOpen(false);setPhase('success');}};
  const copyMeet=()=>{setCopied(true);clearTimeout(copyTimer.current);copyTimer.current=setTimeout(()=>setCopied(false),1600);};
  const advance=()=>setStage(s=>Math.min(s+1,3));
  const confirmLab=()=>{setStage(s=>Math.min(s+1,3));setRoute('lab');};
  const b=bmiInfo(weight,height);

  return (
    <div style={{display:'flex',justifyContent:'center',minHeight:'100vh',background:'#E7E5DE'}}>
      <div style={{width:'100%',maxWidth:440,minHeight:'100vh',height:'100vh',background:'#F6F5F1',display:'flex',flexDirection:'column',position:'relative',overflow:'hidden',boxShadow:'0 0 60px rgba(0,0,0,.12)'}}>

        {phase==='onboard' && <Onboard {...{pg,setPg,next,gender,setGender,age,setAge,weight,setWeight,height,setHeight,b,ans,chooseAdvance,toggleMedical,pincode,onPin,pinChecked,checkPin,consultDate,setConsultDate,consultSlot,setConsultSlot,otpOpen,setOtpOpen,otp,onOtp,verifyOtp}} />}

        {phase==='success' && <Success onNext={()=>setPhase('payment')} />}

        {phase==='payment' && <Payment onBack={()=>setPhase('success')} onPay={()=>{setPhase('app');setRoute('home');setStage(0);}} />}

        {phase==='app' && <AppShell {...{route,go,stage,drawer,setDrawer,apptTab,setApptTab,profileTab,setProfileTab,advance,confirmLab,labDate,setLabDate,labSlot,setLabSlot,waNotif,setWaNotif,copied,copyMeet,notif,setNotif}} />}

      </div>
    </div>
  );
}

// ================= ONBOARDING =================
function Onboard(p){
  const {pg,next,b}=p;
  const isQ = pg>=1 && pg<=6;
  const Q = isQ ? QMAP[pg] : null;
  let footer=null;
  if(pg===0) footer={label:'Continue',action:next};
  else if(isQ && Q.multi) footer={label:'Continue',action:next};
  else if(pg===7) footer={label:p.pinChecked?'Continue':'Check availability',action:p.pinChecked?next:p.checkPin};
  else if(pg===8) footer={label:'Book consult',action:()=>p.setOtpOpen(true)};

  return (<>
    <div style={{display:'flex',alignItems:'center',gap:14,padding:'16px 20px 6px',flexShrink:0}}>
      {pg>0 && <button onClick={()=>p.setPg(x=>Math.max(x-1,0))} style={{width:38,height:38,borderRadius:'50%',border:'none',background:'#EDEBE4',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><Ic n="arrow_back" s={22} c="#1A1A17"/></button>}
      <div style={{flex:1,height:5,background:'#E2DFD6',borderRadius:99,overflow:'hidden'}}><div style={{height:'100%',background:'#1A1A17',borderRadius:99,transition:'width .45s cubic-bezier(.4,0,.2,1)',width:((pg+1)/9*100)+'%'}}/></div>
    </div>

    <div className="scr" style={{flex:1,padding:'14px 22px 40px'}}>
      {pg===0 && <EligStep {...p} b={b} />}
      {isQ && <QuestionStep key={pg} Q={Q} ans={p.ans} choose={p.chooseAdvance} toggleMedical={p.toggleMedical} />}
      {pg===7 && <PinStep pincode={p.pincode} onPin={p.onPin} pinChecked={p.pinChecked} />}
      {pg===8 && <ConsultStep consultDate={p.consultDate} setConsultDate={p.setConsultDate} consultSlot={p.consultSlot} setConsultSlot={p.setConsultSlot} />}
    </div>

    {footer && <div style={{flexShrink:0,padding:'14px 22px calc(20px + env(safe-area-inset-bottom))',background:'linear-gradient(180deg,rgba(246,245,241,0),#F6F5F1 34%)'}}>
      <button onClick={footer.action} style={pillBtn}>{footer.label}</button>
    </div>}

    {p.otpOpen && <OtpSheet otp={p.otp} onOtp={p.onOtp} verify={p.verifyOtp} close={()=>p.setOtpOpen(false)} />}
  </>);
}

function EligStep(p){
  const {b}=p;
  const Slider=({label,val,set,min,max,unit})=>(
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:5}}><label style={{fontSize:13,fontWeight:600,color:'#57534A'}}>{label}</label><span className="hd" style={{fontSize:18,fontWeight:700}}>{val} <span style={{fontSize:11,color:'#9A958A',fontWeight:500}}>{unit}</span></span></div>
      <input type="range" min={min} max={max} value={val} onChange={e=>set(+e.target.value)} style={{width:'100%',display:'block',margin:0}}/>
    </div>);
  const Seg=({g})=><button onClick={()=>p.setGender(g)} style={seg(p.gender===g)}>{g}</button>;
  return (
    <div style={{animation:'okRise .4s ease both'}}>
      <div style={kicker}>Step 1 · Eligibility</div>
      <h1 className="hd" style={{fontSize:32,fontWeight:700,lineHeight:1.06,margin:'0 0 24px'}}>Let's check<br/>your eligibility</h1>
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        <div><label style={{fontSize:13,fontWeight:600,color:'#57534A',display:'block',marginBottom:7}}>Full name</label><input defaultValue="Rahul Nair" style={{width:'100%',border:'1px solid #EDEAE2',background:'#fff',borderRadius:16,padding:'15px 16px',fontSize:15}}/></div>
        <div><label style={{fontSize:13,fontWeight:600,color:'#57534A',display:'block',marginBottom:7}}>Gender</label>
          <div style={{display:'flex',background:'#EDEBE4',borderRadius:16,padding:4,gap:3}}><Seg g="Male"/><Seg g="Female"/><Seg g="Other"/></div>
        </div>
        <div style={{background:'#fff',border:'1px solid #EDEAE2',borderRadius:16,padding:'16px 18px',display:'flex',flexDirection:'column',gap:15}}>
          <Slider label="Age" val={p.age} set={p.setAge} min={18} max={75} unit="yrs"/>
          <div style={{height:1,background:'#F0EEE7'}}/>
          <Slider label="Weight" val={p.weight} set={p.setWeight} min={40} max={160} unit="kg"/>
          <div style={{height:1,background:'#F0EEE7'}}/>
          <Slider label="Height" val={p.height} set={p.setHeight} min={140} max={210} unit="cm"/>
        </div>
      </div>
      <div style={{display:'flex',justifyContent:'center',marginTop:24}}>
        <div style={{display:'inline-flex',alignItems:'center',gap:14,border:'2px solid '+b.color,background:'#fff',borderRadius:16,padding:'12px 20px'}}>
          <div><div style={{fontSize:11,color:'#9A958A',fontWeight:600,letterSpacing:'.04em'}}>BMI</div><div className="hd" style={{fontSize:26,fontWeight:700,lineHeight:1,marginTop:1}}>{b.bmi}</div></div>
          <div style={{width:1,height:34,background:'#EDEAE2'}}/>
          <span style={{fontSize:14,fontWeight:700,color:b.color}}>{b.label}</span>
        </div>
      </div>
      {b.eligible
        ? <div style={{background:'#EAF1E7',border:'1px solid #D6E2D2',borderRadius:18,padding:'16px 18px',marginTop:16,display:'flex',gap:11,alignItems:'center',animation:'okRise .35s ease both'}}><div style={{width:34,height:34,borderRadius:'50%',background:'#5C7A5C',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><Ic n="check" s={20} c="#fff"/></div><div><div style={{fontSize:14.5,fontWeight:600,color:'#46603F'}}>You're eligible</div><div style={{fontSize:12.5,color:'#5A6B57',marginTop:1}}>OneKilo's program is a strong fit. Let's continue.</div></div></div>
        : <div style={{background:'#fff',border:'1px solid #EDEAE2',borderRadius:18,padding:'16px 18px',marginTop:16,display:'flex',gap:11,alignItems:'flex-start'}}><Ic n="info" s={22} c="#9A958A"/><div style={{fontSize:13,color:'#57534A',lineHeight:1.5}}>OneKilo is designed for a BMI of 25+. You can still continue — our doctor will advise the best path for you.</div></div>}
    </div>
  );
}

function QuestionStep({Q,ans,choose,toggleMedical}){
  return (
    <div style={{animation:'okFade .3s ease both'}}>
      <div style={kicker}>{Q.kicker}</div>
      <h1 className="hd" style={{fontSize:30,fontWeight:700,lineHeight:1.08,margin:'0 0 18px'}}>{Q.heading}</h1>
      <div style={{fontSize:16,fontWeight:600,lineHeight:1.35,marginBottom:6}}>{Q.title}</div>
      {Q.subtitle && <p style={{fontSize:13.5,color:'#9A958A',margin:'0 0 20px',lineHeight:1.45}}>{Q.subtitle}</p>}
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        {Q.opts.map(([key,label,sub])=>{
          const on = Q.multi ? ans.medical.includes(key) : ans[Q.field]===key;
          const icon = Q.multi ? (on?'check_box':'check_box_outline_blank') : (on?'check_circle':'radio_button_unchecked');
          return <div key={key} onClick={()=>Q.multi?toggleMedical(key):choose(Q.field,key)} style={optRow(on)}>
            <div style={{flex:1,minWidth:0}}><div style={{fontSize:14.5,fontWeight:600}}>{label}</div>{sub&&<div style={{fontSize:12.5,color:'#9A958A',marginTop:3,lineHeight:1.4}}>{sub}</div>}</div>
            <Ic n={icon} s={23} c={on?'#5C7A5C':'#C9C4B8'}/>
          </div>;
        })}
      </div>
    </div>
  );
}

function PinStep({pincode,onPin,pinChecked}){
  return (
    <div style={{animation:'okFade .3s ease both'}}>
      <div style={kicker}>Almost there</div>
      <h1 className="hd" style={{fontSize:32,fontWeight:700,lineHeight:1.06,margin:'0 0 10px'}}>Are we in<br/>your area?</h1>
      <p style={{fontSize:15,color:'#9A958A',margin:'0 0 24px',lineHeight:1.5}}>OneKilo delivers care to your door. Enter your pincode to check availability.</p>
      <label style={{fontSize:13,fontWeight:600,color:'#57534A',display:'block',marginBottom:8}}>Pincode</label>
      <input value={pincode} onChange={e=>onPin(e.target.value)} inputMode="numeric" placeholder="e.g. 682017" style={{width:'100%',border:'1px solid #EDEAE2',background:'#fff',borderRadius:16,padding:16,fontSize:20,fontWeight:600,letterSpacing:'.14em',fontFamily:'Poppins,sans-serif'}}/>
      {pinChecked && <div style={{background:'#EAF1E7',border:'1px solid #D6E2D2',borderRadius:20,padding:20,marginTop:20,display:'flex',gap:13,alignItems:'center',animation:'okRise .35s ease both'}}><div style={{width:44,height:44,borderRadius:'50%',background:'#5C7A5C',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><Ic n="check" s={26} c="#fff"/></div><div><div style={{fontSize:16,fontWeight:600,color:'#46603F'}}>Good news — we're in Kochi!</div><div style={{fontSize:13,color:'#5A6B57',marginTop:2}}>Home consults, labs, and delivery are all available at {pincode}.</div></div></div>}
    </div>
  );
}

function ConsultStep({consultDate,setConsultDate,consultSlot,setConsultSlot}){
  const dates=[['Tue','22'],['Wed','23'],['Thu','24'],['Fri','25'],['Sat','26'],['Sun','27']];
  const slots=['9:00 AM','10:30 AM','11:15 AM','1:00 PM','2:30 PM','4:00 PM'];
  return (
    <div style={{animation:'okFade .3s ease both'}}>
      <div style={kicker}>Get started</div>
      <h1 className="hd" style={{fontSize:32,fontWeight:700,lineHeight:1.06,margin:'0 0 22px'}}>Book your<br/>first consult</h1>
